name: Publish on push

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          # npm's own trusted-publishing docs explicitly recommend disabling package
          # manager caching in release/publish workflows.

      - name: Upgrade npm for OIDC support
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"

      - name: Strip empty _authToken so npm falls back to OIDC
        # actions/setup-node's registry-url writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
        # into .npmrc. With no NODE_AUTH_TOKEN secret (the point of trusted publishing), that
        # expands to an empty string - npm treats the empty line as "auth is configured" and
        # skips the OIDC exchange, failing with ENEEDAUTH/E404 instead of publishing.
        # https://github.com/npm/documentation/issues/1960
        run: sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build:production

      - name: Copy package.json and README into dist
        run: |
          cp package.json dist/package.json
          cp README.md dist/README.md

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
